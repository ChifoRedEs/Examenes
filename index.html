<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <title>Exámenes y Test</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/test.css">
  <link rel="stylesheet" href="./css/modals.css">
</head>
<body>
  <header class="app-header"><h1>Exámenes y Test</h1><p>Prepara tu oposición a tu ritmo</p></header>

  <main class="contenedor">
    <!-- Menú principal: se genera dinámicamente -->
    <section id="pantalla-menu" class="pantalla"><div id="menu-lista"></div></section>

    <!-- Guardado: exportar / importar -->
    <section id="pantalla-guardado" class="pantalla" hidden>
      <h2>Estadísticas</h2>
      <p class="ayuda">Tus resultados se guardan solo en este navegador. Descarga una copia para llevarla a otro navegador o dispositivo, o para no perderlos si borras los datos del navegador.</p>
      <div class="subida">
        <button type="button" class="btn btn-primario" id="btn-exportar">Exportar estadísticas</button>
      </div>
      <div class="subida">
        <label class="btn btn-sec">Importar estadísticas<input class="sr-only" type="file" id="in-backup" accept=".json,application/json"></label>
      </div>
      <p class="ayuda" id="uso-almacen"></p>
    </section>

    <!-- Test en curso -->
    <section id="pantalla-test" class="pantalla" hidden>
      <div id="test-cabecera"></div><div id="test-cuerpo"></div><div id="test-pie"></div>
    </section>

    <!-- Resultados -->
    <section id="pantalla-resultado" class="pantalla" hidden><div id="resultado"></div></section>
  </main>

  <nav class="nav" id="nav" aria-label="Secciones">
    <button class="nav-btn" data-go="pantalla-menu"><span aria-hidden="true">📚</span>Tests</button>
    <button class="nav-btn" data-go="pantalla-guardado"><span aria-hidden="true">💾</span>Guardado</button>
  </nav>

  <!-- Modales -->

  <dialog id="modal-confirm" class="modal"><form method="dialog">
    <p id="confirm-msg"></p>
    <div class="modal-acciones"><button value="no" class="btn btn-sec">Cancelar</button><button value="si" class="btn btn-primario">Aceptar</button></div>
  </form></dialog>

  <dialog id="modal-examen" class="modal"><form method="dialog">
    <h3>Modo Examen</h3>
    <label class="campo">Tiempo en minutos (0 = sin límite)<input type="number" id="ex-min" min="0" max="600" inputmode="numeric"></label>
    <label class="campo">Penalización por fallo
      <select id="ex-pen"><option value="0">Sin penalización</option><option value="0.25">Resta 1/4</option><option value="0.3333" selected>Resta 1/3</option><option value="0.5">Resta 1/2</option></select>
    </label>
    <div class="modal-acciones"><button value="no" class="btn btn-sec">Cancelar</button><button value="si" class="btn btn-primario">Empezar examen</button></div>
  </form></dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
